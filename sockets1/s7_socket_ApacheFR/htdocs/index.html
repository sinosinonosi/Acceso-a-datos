<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servidor Apache Java | Sockets</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #e76f51; 
            --secondary-color: #264653; 
            --bg-color: #f8f9fa;
            --text-color: #333;
            --white: #ffffff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: var(--white);
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        .status-badge {
            background-color: #d4edda;
            color: #155724;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-block;
            margin-bottom: 1.5rem;
        }

        h1 {
            color: var(--secondary-color);
            font-size: 2rem;
            margin: 0 0 1rem 0;
            font-weight: 700;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 0;
        }

        .divider {
            height: 4px;
            width: 50px;
            background: var(--primary-color);
            margin: 0 auto 2rem auto;
            border-radius: 2px;
        }

        .footer-note {
            margin-top: 3rem;
            font-size: 0.85rem;
            color: #888;
            font-weight: 500;
            border-top: 1px solid #eee;
            padding-top: 1.5rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="status-badge">● Sistema Online</div>
        <h1>Servidor Apache Java</h1>
        <div class="divider"></div>
        <p>El despliegue del entorno se ha completado con éxito. La arquitectura está lista para la gestión de peticiones y procesamiento de datos.</p>
        
        <div class="footer-note">
            Práctica Sockets
        </div>
    </div>

</body>
</html>
